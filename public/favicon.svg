<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0a0f1a"/>

  <!-- Outer hex frame — accent orange -->
  <polygon
    points="446,256 351,92 161,92 66,256 161,421 351,421"
    fill="#0d1520"
    stroke="oklch(72% 0.18 52)"
    stroke-width="14"
    stroke-linejoin="miter"
  />

  <!-- Inner hex ring — primary blue, thin -->
  <polygon
    points="416,256 336,117 176,117 96,256 176,395 336,395"
    fill="none"
    stroke="oklch(64% 0.17 213)"
    stroke-width="3"
    stroke-linejoin="miter"
    opacity="0.35"
  />

  <!-- Targeting circle — primary blue -->
  <circle cx="256" cy="256" r="125" fill="none" stroke="oklch(64% 0.17 213)" stroke-width="6"/>

  <!-- Crosshair lines — primary blue, gap in center -->
  <line x1="256" y1="131" x2="256" y2="211" stroke="oklch(64% 0.17 213)" stroke-width="5"/>
  <line x1="256" y1="301" x2="256" y2="381" stroke="oklch(64% 0.17 213)" stroke-width="5"/>
  <line x1="131" y1="256" x2="211" y2="256" stroke="oklch(64% 0.17 213)" stroke-width="5"/>
  <line x1="301" y1="256" x2="381" y2="256" stroke="oklch(64% 0.17 213)" stroke-width="5"/>

  <!-- 45° tick marks on targeting circle — primary blue -->
  <line x1="337" y1="175" x2="357" y2="155" stroke="oklch(64% 0.17 213)" stroke-width="4"/>
  <line x1="175" y1="175" x2="155" y2="155" stroke="oklch(64% 0.17 213)" stroke-width="4"/>
  <line x1="175" y1="337" x2="155" y2="357" stroke="oklch(64% 0.17 213)" stroke-width="4"/>
  <line x1="337" y1="337" x2="357" y2="357" stroke="oklch(64% 0.17 213)" stroke-width="4"/>

  <!-- Center diamond — accent orange -->
  <polygon
    points="256,236 278,256 256,276 234,256"
    fill="oklch(72% 0.18 52)"
  />
</svg>
